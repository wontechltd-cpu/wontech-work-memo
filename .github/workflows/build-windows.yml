name: Build WONTECH Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run pack:win

      - name: Upload Windows program
        uses: actions/upload-artifact@v4
        with:
          name: WONTECH-Windows-App
          path: dist/WONTECH_업무메모-win32-x64/**
          retention-days: 90
